<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <link rel="icon" href="favicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEI — Mobile &amp; Tablet Preview</title>
<style>
  :root { --ink:#030303; --gold:#b7894f; --paper:#f3ede3; --muted:#9b9183; }
  * { box-sizing:border-box; }
  body { margin:0; background:#111; color:var(--paper); font-family:"Plus Jakarta Sans",Arial,sans-serif; }
  header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:18px 24px; background:#111; border-bottom:1px solid rgba(183,137,79,.3); }
  header h1 { font-size:.82rem; letter-spacing:.2em; text-transform:uppercase; margin:0 auto 0 0; color:var(--gold); }
  select, button { background:transparent; color:var(--paper); border:1px solid var(--gold); padding:9px 14px; font:inherit; font-size:.72rem; letter-spacing:.08em; }
  button { cursor:pointer; }
  button:hover { background:var(--gold); color:var(--ink); }
  .stage { display:flex; flex-wrap:wrap; gap:22px; padding:24px; align-items:flex-start; }
  .panel { flex:0 0 auto; }
  .panel__head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:12px; }
  .panel__head h2 { font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); margin:0; }
  .panel__head span { font-size:.66rem; color:var(--muted); }
  .frame { background:var(--paper); border:8px solid #000; border-radius:22px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.6); }
  .frame iframe { display:block; border:0; background:#fff; }
  .frame--mobile { width:406px; }
  .frame--mobile iframe { width:390px; height:844px; }
  /* Tablet is a true 820px viewport scaled down to fit the pane. */
  .frame--tablet { width:508px; }
  .scale-wrap { width:492px; height:540px; overflow:hidden; }
  .scale-wrap iframe { width:820px !important; height:900px !important; transform:scale(.6); transform-origin:top left; }
</style>
</head>
<body>
<header>
  <h1>BEI — Responsive Preview</h1>
  <label for="page">Page</label>
  <select id="page">
    <option value="index.html">Home</option>
    <option value="about.html">About BEI</option>
    <option value="membership.html">Membership</option>
    <option value="all-businesses.html">Business Directory</option>
    <option value="events.html">Events</option>
    <option value="trade-catalogue.html">Trade Catalogue</option>
    <option value="contact.html">Contact</option>
    <option value="sign-in.html">Login / Register</option>
    <option value="faqs.html">FAQs</option>
    <option value="directory.html">Business Detail</option>
    <option value="blog.html">Journal</option>
  </select>
  <button type="button" id="reload">Reload both</button>
</header>

<main class="stage">
  <section class="panel">
    <div class="panel__head"><h2>Mobile</h2><span>390 × 844 px</span></div>
    <div class="frame frame--mobile"><iframe id="mobile" src="http://localhost:3000/index.html" title="Mobile preview"></iframe></div>
  </section>
  <section class="panel">
    <div class="panel__head"><h2>Tablet</h2><span>820 px viewport · scaled to fit</span></div>
    <div class="frame frame--tablet"><div class="scale-wrap"><iframe id="tablet" src="http://localhost:3000/index.html" title="Tablet preview"></iframe></div></div>
  </section>
</main>

<script>
(function(){
  var sel = document.getElementById('page');
  var m = document.getElementById('mobile');
  var t = document.getElementById('tablet');
  var BASE = 'http://localhost:3000/';
  function set(){
    m.src = BASE + sel.value;
    t.src = BASE + sel.value;
  }
  sel.addEventListener('change', set);
  document.getElementById('reload').addEventListener('click', function(){
    m.src = m.src; t.src = t.src;
  });
  /* Fixed iframe widths give each preview its real device viewport. */
  m.style.width = '390px';
  t.style.width = '820px';
  t.style.height = '900px';
})();
</script>
</body>
</html>
