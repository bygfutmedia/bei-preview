<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEI — Mobile Preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#111; color:#f3ede3; font-family:"Plus Jakarta Sans",Arial,sans-serif; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 18px; border-bottom:1px solid rgba(183,137,79,.3); }
  header h1 { font-size:.78rem; letter-spacing:.2em; text-transform:uppercase; color:#b7894f; margin:0 auto 0 0; }
  select, button { background:transparent; color:#f3ede3; border:1px solid #b7894f; padding:8px 12px; font:inherit; font-size:.72rem; }
  .stage { display:flex; justify-content:center; padding:24px 12px 40px; }
  .frame { width:390px; max-width:100%; background:#f3ede3; border:8px solid #000; border-radius:22px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.6); }
  .frame iframe { display:block; width:390px; max-width:100%; height:844px; border:0; background:#fff; }
  @media (max-width:420px) {
    .stage { padding:12px 6px 24px; }
    .frame { border-width:4px; }
  }
</style>
</head>
<body>
<header>
  <h1>BEI — Mobile Preview (390px)</h1>
  <label for="page">Page</label>
  <select id="page">
    <option value="index.html">Home</option>
    <option value="about.html">About BEI</option>
    <option value="membership.html">Membership</option>
    <option value="all-businesses.html">Business Directory</option>
    <option value="search-businesses.html">Search Businesses</option>
    <option value="events.html">Events</option>
    <option value="trade-catalogue.html">Trade Catalogue</option>
    <option value="contact.html">Contact</option>
    <option value="sign-in.html">Login / Register</option>
    <option value="faqs.html">FAQs</option>
    <option value="directory.html">Business Detail</option>
  </select>
  <button type="button" id="reload">Reload</button>
</header>
<main class="stage">
  <div class="frame"><iframe id="mobile" src="index.html" title="Mobile preview"></iframe></div>
</main>
<script>
(function(){
  var sel = document.getElementById('page');
  var frame = document.getElementById('mobile');
  sel.addEventListener('change', function(){ frame.src = sel.value; });
  document.getElementById('reload').addEventListener('click', function(){ frame.src = frame.src; });
})();
</script>
</body>
</html>
