<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
  <link rel="icon" href="favicon.png" type="image/png"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add Business — BEI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/bei.css"></head>
<body data-page="dashboard"><div class="grain" aria-hidden="true"></div><div id="bei-header"></div>
<main id="content">
<section class="page-hero"><div class="meta" data-reveal>Home / Dashboard / Add Business</div><div class="page-hero__grid"><h1 class="page-hero__title" data-reveal style="--d:80ms">Add your <em>business</em></h1><div class="page-hero__aside" data-reveal style="--d:160ms"><p>Claim a listing for your Black owned business.</p></div></div></section>
<section class="section section--paper" data-nav="light"><div class="split"><div><div class="meta meta--dark" data-reveal>Listing details</div><h2 class="h-display" data-reveal style="--d:80ms">Tell us about <em>your business.</em></h2><p class="lede" data-reveal style="--d:140ms">Fields are marked as placeholders until supplied by the business owner.</p></div>
<form data-demo-form data-reveal style="--d:180ms">
<div class="form-row"><div class="form-field"><label for="b-name">Business name *</label><input id="b-name" required placeholder="[BUSINESS NAME]"></div><div class="form-field"><label for="b-web">Website</label><input id="b-web" type="url" placeholder="[WEBSITE]"></div></div>
<div class="form-field"><label for="b-desc">About the business *</label><textarea id="b-desc" required placeholder="[BUSINESS DESCRIPTION]"></textarea></div>
<div class="form-row"><div class="form-field"><label for="b-email">Email *</label><input id="b-email" type="email" required placeholder="[EMAIL]"></div><div class="form-field"><label for="b-phone">Telephone</label><input id="b-phone" type="tel" placeholder="[PHONE]"></div></div>
<div class="form-field"><label for="b-addr">Address</label><input id="b-addr" placeholder="[ADDRESS]"></div>
<div class="form-row"><div class="form-field"><label for="b-loc">Location</label><select id="b-loc"><option>Select location</option><option>Asia</option><option>Caribbean</option><option>East Africa</option><option>Europe</option><option>North Africa</option><option>North America</option><option>Oceania</option><option>South Africa</option><option>South America</option><option>UK</option><option>West Africa</option></select></div><div class="form-field"><label for="b-cat">Category</label><select id="b-cat"><option>Select category</option><option>Business Services</option><option>Consulting</option><option>Retail</option><option>Entertainment</option><option>Food &amp; Dining</option><option>Education</option><option>Other</option></select></div></div>
<button class="auth__submit" type="submit">Submit listing <span>&rarr;</span></button>
<p class="meta meta--dark" data-form-msg style="display:none;margin-top:16px"></p>
</form></div></section>
</main><div id="bei-footer"></div><script src="assets/js/bei.js"></script></body></html>
