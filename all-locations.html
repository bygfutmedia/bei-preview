<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <link rel="icon" href="favicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Locations — BEI Business Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/bei.css">
</head>
<body data-page="directory">
<div class="grain" aria-hidden="true"></div>
<div id="bei-header"></div>
<main id="content">
  <section class="page-hero">
    <div class="meta" data-reveal>Home &nbsp;/&nbsp; All Locations</div>
    <div class="page-hero__grid"><h1 class="page-hero__title" data-reveal style="--d:80ms">All <em>Locations</em></h1><div class="page-hero__aside" data-reveal style="--d:160ms"><p>UK · Europe · North America · South America · Africa · Asia · Oceania</p></div></div>
  </section>
  <section class="section section--paper" data-nav="light">
    <div id="location-list"></div>
  </section>
  <section class="cta-band"><div class="meta cta-band__meta" data-reveal>Go global</div><h2 class="display" data-reveal style="--d:80ms">A directory without <em>borders.</em></h2><a class="cta-inline" href="membership.html" data-reveal style="--d:160ms">Join BEI <span>&rarr;</span></a></section>
</main>
<div id="bei-footer"></div>
<script>
(function(){
  var locs = ["Asia","Caribbean","East Africa","Europe","North Africa","North America","Oceania","South Africa","South America","UK","West Africa"];
  var host = document.getElementById('location-list');
  host.innerHTML = locs.map(function(l,i){
    return '<a class="event-row" href="single-location.html?location='+encodeURIComponent(l.toLowerCase().replace(/ /g,'-'))+'" data-reveal style="--d:'+((i%4)*40)+'ms"><div class="event-row__date">'+String(i+1).padStart(2,'0')+'</div><div><h3>'+l+'</h3><div class="meta meta--muted">[BUSINESS COUNT] businesses</div></div><span class="bizrow__arrow">&rarr;</span></a>';
  }).join('');
})();
</script>
<script src="assets/js/bei.js"></script>
</body>
</html>
